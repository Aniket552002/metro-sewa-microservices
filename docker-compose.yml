services:
  prometheus:
    image: prom/prometheus
    container_name: metrosewa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: metrosewa-grafana
    ports:
      - "3000:3000"

  mariadb:
    image: mariadb:11
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: metro_user_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  route-redis:
    image: redis:latest
    container_name: route-redis
    ports:
      - "6379:6379"

  route-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: route-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"

volumes:
  mariadb_data:
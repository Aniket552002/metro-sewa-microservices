server:
  port: 8083

spring:
  application:
    name: ticket-service

  datasource:
    url: jdbc:mariadb://localhost:3308/metro_ticket_db
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

route-service:
  url: http://localhost:8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html

    resilience4j:
      circuitbreaker:
        instances:
          routeService:
            failure-rate-threshold: 50
            minimum-number-of-calls: 5
            wait-duration-in-open-state: 10s
            sliding-window-size: 10
            permitted-number-of-calls-in-half-open-state: 3

      timelimiter:
        instances:
          routeService:
            timeout-duration: 3s
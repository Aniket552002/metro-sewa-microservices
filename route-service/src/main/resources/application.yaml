server:
  port: 8082

spring:
  application:
    name: route-service

  datasource:
    url: jdbc:mariadb://localhost:3307/metro_route_db
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: 1h
      cache-null-values: false

  elasticsearch:
    uris: http://localhost:9200

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cache.interceptor: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.data.redis: INFO
    org.springframework.data.redis.cache: INFO
    io.lettuce.core: WARN